# 大A 上证个股 LLM 模拟策略台 — 本地配置
listen_host: "127.0.0.1"
listen_port: 8000
db_path: "data/daa.db"

# 行情
poll_interval_sec: 30
degrade_age_sec: 45
halt_fail_count: 3
halt_recover_success: 2
# 仅连续竞价时段轮询行情（09:30–11:30、13:00–15:00 工作日）；策略/手动刷新仍可即时拉一次
poll_only_in_session: true
# mock | akshare
market_source: "akshare"
# stocks = 交易池用 stocks；indices = 旧指数池（仅兼容）
trading_universe: "stocks"
# 手动下单是否忽略时段（true=随时可练）；自动策略与行情轮询仍按真实连续竞价时段
force_session: true

initial_cash: 1000000
lot_size: 100

commission_rate: 0.00025
min_commission: 5
stamp_tax_rate: 0.0005
transfer_fee_rate: 0.00001


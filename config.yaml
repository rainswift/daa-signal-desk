# LLM 策略（方舟）；Key 只从环境变量 ARK_API_KEY 读取
strategy:
  max_signals: 5
  max_buy_pct_equity: 0.15
  temperature: 0.2
  # 开盘后按计划自动跑（连续竞价：09:30–11:30、13:00–15:00，工作日）；每台各跑一轮
  auto:
    enabled: true
    interval_sec: 30
    only_in_session: true
  # 三台独立账本收益竞争；desk 可覆盖 base_url / timeout_sec
  # rules_profile: strategist=原版策略师规则；kurumi/mayari=角色重写完整规则
  desks:
    - id: strategist
      name: 策略师 · DeepSeek
      model: deepseek-v4-1-flash-261017
      rules_profile: strategist
    - id: deepseek
      name: 福贺久留美 · DeepSeek
      model: deepseek-v4-1-flash-261017
      rules_profile: kurumi
    - id: seed
      name: 早乙女芽亚里 · Doubao
      model: doubao-seed-2-1-lite
      rules_profile: mayari

# 火山方舟 Agent Plan（OpenAI 兼容）；model 供周报默认使用
ark:
  base_url: "https://ark.cn-beijing.volces.com/api/plan/v3"
  model: "deepseek-v4-1-flash-261017"
  timeout_sec: 90
weekly:
  year: 2026
  full_industry: false

[project]
name = "daa-virtual-desk"
version = "0.1.0"
description = "大A 指数虚拟盘本地模拟柜台"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pyyaml>=6.0.2",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
market = ["akshare>=1.14.0", "pandas>=2.0.0"]
dev = ["httpx>=0.27.0", "pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
